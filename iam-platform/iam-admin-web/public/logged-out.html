<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>已退出登录 · 管理后台</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0b1b3d 0%, #1a3a6b 50%, #2a5aa0 100%);
            display: flex; align-items: center; justify-content: center;
        }
        .logout-card {
            width: 400px; background: #ffffff; border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4); padding: 44px 36px; text-align: center;
        }
        .logout-card .icon { font-size: 48px; margin-bottom: 14px; }
        .logout-card h1 { font-size: 22px; color: #0f172a; margin-bottom: 8px; }
        .logout-card p { font-size: 13px; color: #64748b; margin-bottom: 28px; }
        .btn {
            display: inline-block; padding: 12px 36px; border-radius: 8px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff;
            font-size: 15px; font-weight: 500; text-decoration: none;
            box-shadow: 0 4px 16px rgba(37,99,235,0.35); transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,0.5); }
    </style>
</head>
<body>
    <div class="logout-card">
        <div class="icon">👋</div>
        <h1>已退出管理后台</h1>
        <p>您已安全退出登录，认证中心会话也已注销。</p>
        <a href="/login" class="btn">重新登录</a>
    </div>
</body>
</html>
