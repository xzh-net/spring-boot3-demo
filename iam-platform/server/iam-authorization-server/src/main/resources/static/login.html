<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            min-height: 100vh;
            background: #f1f5f9;
            display: flex; align-items: center; justify-content: center;
            color: #0f172a;
        }
        .login-card {
            width: 400px; background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06), 0 24px 48px rgba(15, 23, 42, 0.08);
            padding: 40px 36px;
            border: 1px solid #e2e8f0;
        }
        .login-card h1 {
            font-size: 22px; font-weight: 700; text-align: center;
            margin-bottom: 6px; color: #0f172a;
        }
        .login-card .subtitle {
            font-size: 12px; color: #64748b; text-align: center;
            margin-bottom: 28px; letter-spacing: 0.3px;
        }
        .form-row { margin-bottom: 18px; }
        .form-row label {
            display: block; font-size: 12px; color: #475569;
            margin-bottom: 6px; font-weight: 500;
        }
        .form-row input {
            width: 100%; padding: 12px 14px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            color: #0f172a; font-size: 14px;
            outline: none; transition: all 0.2s;
        }
        .form-row input::placeholder { color: #94a3b8; }
        .form-row input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        .btn-login {
            width: 100%; padding: 12px;
            background: #2563eb;
            color: #fff; font-size: 15px; font-weight: 600;
            border: none; border-radius: 8px; cursor: pointer;
            transition: all 0.2s; margin-top: 6px;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }
        .btn-login:hover {
            background: #1d4ed8;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }
        .btn-login:active { transform: translateY(0); }
        .alert {
            padding: 10px 14px; border-radius: 8px; font-size: 13px;
            margin-bottom: 16px; display: none;
        }
        .alert.error {
            background: #fef2f2;
            border: 1px solid #fecaca; color: #dc2626;
        }
        .alert.logout {
            background: #f0fdf4;
            border: 1px solid #bbf7d0; color: #16a34a;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🚀 统一认证中心</h1>

        <div id="errorAlert" class="alert error">用户名或密码错误，请重试</div>
        <div id="expiredAlert" class="alert error" style="display:none">会话已过期或已在其他设备登录，请重新登录</div>
        <div id="logoutAlert" class="alert logout">您已成功退出登录</div>

        <form action="/login" method="post">
            <div class="form-row">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username" required>
            </div>
            <div class="form-row">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-login">登 录</button>
        </form>
    </div>

<script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var err = params.get('error');
        if (err !== null) {
            var alertEl = document.getElementById('errorAlert');
            // 锁定 (A-P1-2 防爆破): 明确提示 + 具体等待分钟数 (retry 由失败跳转 URL 携带)
            if (err === 'locked') {
                var retry = params.get('retry');
                alertEl.textContent = '登录尝试过多，请 ' + (retry || '15') + ' 分钟后再试';
            } else if (err === 'access_denied') {
                // 登录准入拒绝 (client_login_policy 准入表未命中) 与密码错误区分提示
                alertEl.textContent = '当前账号无权登录该应用，请使用对应端的账号';
            } else {
                alertEl.textContent = '用户名或密码错误，请重试';
            }
            alertEl.style.display = 'block';
        }
        if (params.get('logout') !== null) {
            document.getElementById('logoutAlert').style.display = 'block';
        }
        // 会话过期/被顶下线 (A-P1-4): expiredUrl 落点, 给出明确提示
        if (params.get('expired') !== null) {
            var expiredEl = document.getElementById('expiredAlert');
            if (expiredEl) expiredEl.style.display = 'block';
        }
        // 设备验证链跳转过来时带 ?type=device, 将表单 action 改为 /device-login
        if (params.get('type') === 'device') {
            document.querySelector('form').action = '/device-login';
        }
    })();
</script>
</body>
</html>
