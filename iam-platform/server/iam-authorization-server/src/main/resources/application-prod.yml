spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://prod-db-host:3306/iam?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=false}
    username: ${DB_USERNAME:oauth2_app}
    password: ${DB_PASSWORD:CHANGE_ME}

  data:
    redis:
      host: ${REDIS_HOST:prod-redis-host}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:CHANGE_ME}
      database: 0

# 生产环境降低日志级别
logging:
  level:
    root: WARN
    net.xzh.iam: INFO
    org.springframework.security: WARN
    org.springframework.security.oauth2: WARN
    org.springframework.security.authorization: WARN

iam:
  # 生产必须显式提供对外可访问的 issuer
  issuer: ${IAM_ISSUER:https://iam.example.com}
  jwk:
    # 建议挂载持久化卷; 多实例需共享同一文件
    keystore-path: ${IAM_JWK_KEYSTORE:/opt/iam-platform/jwks.json}
