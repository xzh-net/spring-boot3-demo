<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>已退出登录</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 48px 40px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
        }
        .card h1 {
            font-size: 22px;
            color: #0f172a;
            margin: 0 0 12px;
        }
        .card p {
            color: #64748b;
            margin: 0 0 24px;
        }
        .card a {
            display: inline-block;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 14px;
        }
        .card a:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>已安全退出</h1>
        <p>您已成功退出门户登录</p>
        <a href="http://localhost:8083/">返回门户首页</a>
    </div>
</body>
</html>
