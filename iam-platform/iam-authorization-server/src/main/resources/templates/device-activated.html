<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备授权成功</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            color: #ffffff;
            padding: 32px;
            text-align: center;
        }
        .header .check-icon {
            font-size: 56px;
            margin-bottom: 8px;
        }
        .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .header p { font-size: 13px; opacity: 0.85; }
        .body { padding: 28px 32px; }
        .info-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 14px;
        }
        .info-row + .info-row { border-top: 1px solid #dcfce7; }
        .info-label { color: #64748b; font-weight: 500; }
        .info-value { color: #0f172a; font-weight: 600; }
        .message {
            font-size: 13px;
            color: #64748b;
            line-height: 1.7;
            text-align: center;
            margin-bottom: 20px;
        }
        .footer {
            background: #f8fafc; border-top: 1px solid #e2e8f0;
            padding: 18px 32px;
        }
        .btn {
            width: 100%;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
            text-decoration: none;
            display: block;
            text-align: center;
        }
        .btn:hover {
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            transform: translateY(-1px);
        }
        .tip {
            font-size: 12px; color: #94a3b8; text-align: center; margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="check-icon">✅</div>
            <h1>设备授权成功</h1>
            <p>您的设备已成功完成授权</p>
        </div>
        <div class="body">
            <div class="info-box">
                <div class="info-row">
                    <span class="info-label">状态</span>
                    <span class="info-value" style="color:#16a34a;">已授权 ✓</span>
                </div>
                <div class="info-row">
                    <span class="info-label">授权时间</span>
                    <span class="info-value" th:text="${#dates.format(#dates.createNow(), 'yyyy-MM-dd HH:mm:ss')}">-</span>
                </div>
            </div>
            <div class="message">
                设备已获得访问权限，请关闭此页面并返回设备继续操作。
            </div>
        </div>
        <div class="footer">
            <button class="btn" onclick="tryClosePage()">关闭页面</button>
            <p class="tip">如按钮无效，请手动关闭浏览器标签页</p>
        </div>
    </div>
<script>
    function tryClosePage() {
        window.close();
        // window.close() 仅对 JS 打开的窗口有效, 直接导航的标签页无法关闭
        setTimeout(function () {
            alert('无法自动关闭页面，请手动关闭此浏览器标签页。');
        }, 300);
    }
</script>
</body>
</html>
