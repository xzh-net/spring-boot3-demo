<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备激活</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            padding: 28px 32px;
        }
        .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .header p { font-size: 13px; opacity: 0.85; }
        .body { padding: 28px 32px; }
        .input-group { margin-bottom: 20px; }
        .input-label {
            font-size: 13px; font-weight: 600; color: #334155;
            margin-bottom: 8px; display: block;
        }
        .code-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 6px;
            text-align: center;
            text-transform: uppercase;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s;
            color: #0f172a;
            background: #f8fafc;
        }
        .code-input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        .code-input::placeholder {
            color: #cbd5e1;
            font-weight: 400;
            letter-spacing: 2px;
            font-size: 15px;
        }
        .hint {
            font-size: 12px; color: #64748b;
            margin-top: 8px; line-height: 1.6;
        }
        .footer {
            background: #f8fafc; border-top: 1px solid #e2e8f0;
            padding: 18px 32px;
        }
        .btn {
            width: 100%;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }
        .btn:hover {
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            transform: translateY(-1px);
        }
        .device-icon {
            text-align: center;
            font-size: 48px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>📱 设备激活</h1>
            <p>输入设备上显示的用户码以完成授权</p>
        </div>
        <form th:action="@{/oauth2/device/verify}" method="post">
            <div class="body">
                <div class="device-icon">🖥️</div>
                <div class="input-group">
                    <label class="input-label" for="user_code">用户码</label>
                    <input type="text"
                           id="user_code"
                           name="user_code"
                           class="code-input"
                           placeholder="请输入用户码"
                           autocomplete="off"
                           autofocus
                           required>
                    <div class="hint">
                        请在设备屏幕上找到用户码，输入后点击「确认授权」。<br>
                        确认后将跳转到授权页面，选择要授予的权限。
                    </div>
                </div>
            </div>
            <div class="footer">
                <button type="submit" class="btn">确认授权</button>
            </div>
        </form>
    </div>
</body>
</html>
