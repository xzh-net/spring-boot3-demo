server:
  port: 9000
  servlet:
    context-path: /

spring:
  profiles:
    active: local

  application:
    name: iam-authorization-server
  thymeleaf:
    cache: false

  # ===== MySQL 8 数据源 (Druid 连接池) =====
  # 通用连接池参数 (url/username/password 在 application-{profile}.yml 中按环境配置)
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 50
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: false
      # [安全加固] 禁用 Druid 监控台 (/druid/*): 认证中心未有安全链匹配该路径,
      # 启用 stat-view-servlet 会让控制台对外裸奔且口令硬编码. 如需监控改用本应用日志/Actuator.
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

  # ===== Redis =====
  # host/port/password/database 在 application-{profile}.yml 中按环境配置
  data:
    redis:
      timeout: 10s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 5s

  # ===== Spring Session (HttpSession 持久化到 Redis) =====
  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: "oauth2:session"

# ===== MyBatis-Plus =====
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: net.xzh.iam.auth.entity,net.xzh.iam.resource.entity

# ===== 自定义配置 =====
authserver:
  # 允许访问管理 API (/api/admin/**) 的客户端 client_id 白名单 (阶段 3: 并入 EndpointAdmissionManager admin 域闸门)
  # 注: 原 jwt-issuer/*-time-to-live 死键已清理 — issuer 硬编码于 AuthorizationServerConfig,
  #     令牌 TTL 权威在 DB oauth2_registered_client.token_settings (每客户端) + 生成器默认;
  #     admin-m2m 客户端及其 admin-m2m-client-ids 授予白名单已退役 (跨服务调用链本地化, 无消费方)
  admin-client-ids:
    - admin-app
  # ===== 客户端登录边界策略 (管理端/门户端同库用户的交叉登录隔离, 原 yaml client-identity-policy) =====
  # 角色行: 管理端用户经 /api/admin/policies 维护 (admin-app 默认仅允许 ADMIN 角色, 隔离门户端交叉登录)
  # 用户业务角色权威在单库 iam (sys_user_role, 阶段 4 已本地化, 远程调用退役)
  # 服务令牌判定兜底 (M2M): 列表内 client_id 且无 grant_type 属性的令牌视为服务间调用 (注入 PORTAL_SERVICE_TOKEN)
  service-client-ids: []
  # 门户客户端白名单: 仅列表内客户端签发的令牌可访问 portal 域 (/api/public/**)
  portal-client-ids: [portal-app]

logging:
  level:
    root: INFO
    net.xzh.iam: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.authorization: TRACE
