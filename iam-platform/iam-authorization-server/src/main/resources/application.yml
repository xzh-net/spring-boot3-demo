server:
  port: 9000
  servlet:
    context-path: /

spring:
  profiles:
    active: local

  application:
    name: iam-authorization-server
  thymeleaf:
    cache: false

  # ===== MySQL 8 数据源 (Druid 连接池) =====
  # 通用连接池参数 (url/username/password 在 application-{profile}.yml 中按环境配置)
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 50
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: false
      # [安全加固] 禁用 Druid 监控台 (/druid/*): 认证中心未有安全链匹配该路径,
      # 启用 stat-view-servlet 会让控制台对外裸奔且口令硬编码. 如需监控改用本应用日志/Actuator.
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

  # ===== Redis =====
  # host/port/password/database 在 application-{profile}.yml 中按环境配置
  data:
    redis:
      timeout: 10s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 5s

  # ===== Spring Session (HttpSession 持久化到 Redis) =====
  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: "oauth2:session"

# ===== MyBatis-Plus =====
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: net.xzh.authserver.entity

# ===== 自定义配置 =====
authserver:
  # JWT 签名密钥 (实际生产环境请替换为 RSA 密钥对)
  jwt-issuer: http://localhost:9000
  access-token-time-to-live: PT2H
  refresh-token-time-to-live: PT168H
  authorization-code-time-to-live: PT5M
  device-code-time-to-live: PT5M
  # 允许访问管理 API (/api/admin/**) 的客户端 client_id 白名单
  admin-client-ids:
    - admin-app
  # ===== 令牌签发准入 (改造清单: 准入配置 yaml → iam_client_policy 表) =====
  # 策略行: 管理端用户可经 /api/admin/policies 维护 (admin-app 默认仅允许 ADMIN 角色)
  # 用户业务角色权威在资源中心 iam_authorization (sys_user_role), 认证中心以 D6 内部接口获取
  resource-service-base-url: http://localhost:9010
  service-token-endpoint: http://localhost:9000/oauth2/token
  service-token-client-id: resource-server
  service-token-client-secret: 123456

logging:
  level:
    root: INFO
    net.xzh.authserver: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.authorization: TRACE
