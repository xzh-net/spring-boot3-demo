server:
  port: 9010
  servlet:
    context-path: /

spring:
  profiles:
    active: local

  application:
    name: iam-resource-service

  # ===== MySQL 8 数据源 (Druid 连接池) — 资源中心专用库 (iam_authorization), 承载 RBAC + 业务数据 =====
  # 资源服务器不做 Redis 依赖, 身份/权限直接读 MySQL
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: false

# ===== MyBatis-Plus =====
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: net.xzh.resource.entity

# ===== OAuth2 资源服务器 (Opaque Token introspection) =====
# 所有 Bearer Token 统一交给授权服务器 /oauth2/introspect 校验
spring.security.oauth2.resourceserver.opaquetoken.introspection-uri: http://localhost:9000/oauth2/introspect
spring.security.oauth2.resourceserver.opaquetoken.client-id: resource-server
spring.security.oauth2.resourceserver.opaquetoken.client-secret: 123456

# ===== 认证中心对接 (V6 分库后客户端目录经目录 API 获取) =====
authserver:
  base-url: http://localhost:9000
  client-id: resource-server
  client-secret: 123456
  # 服务令牌白名单 (M2M): 该列表内 client_id 签发的令牌视为服务间调用 (注入 PORTAL_SERVICE_TOKEN),
  # 供 /api/internal/** 鉴权; 未来对外 API 服务平台接入时在此追加
  service-client-ids: [resource-server]
  # 门户客户端白名单: 仅列表内客户端签发的令牌可访问 portal 域 (/api/public/**), 门户信息不对任意客户端开放
  portal-client-ids: [portal-app]

logging:
  level:
    root: INFO
    net.xzh.resource: DEBUG
    org.springframework.security: DEBUG
