# ============================================================
# 生产环境 (prod) — 请替换为实际生产域名
# ============================================================
# 激活方式: --spring.profiles.active=prod
#
# 建议通过环境变量注入:
#   AUTH_SERVER_BASE_URL  -> 认证中心基地址
#   PORTAL_FRONTEND_ORIGIN -> 前端地址

spring:
  security:
    oauth2:
      client:
        registration:
          portal-app-oidc:
            # 生产环境 post-logout 回调地址
            post-logout-redirect-uri: "${PORTAL_FRONTEND_ORIGIN:http://portal.example.com}/logged-out"
        provider:
          spring-auth-server:
            authorization-uri: ${AUTH_SERVER_BASE_URL:http://auth.example.com}/oauth2/authorize
            token-uri: ${AUTH_SERVER_BASE_URL:http://auth.example.com}/oauth2/token
            jwk-set-uri: ${AUTH_SERVER_BASE_URL:http://auth.example.com}/oauth2/jwks
            user-info-uri: ${AUTH_SERVER_BASE_URL:http://auth.example.com}/userinfo
            logout-uri: ${AUTH_SERVER_BASE_URL:http://auth.example.com}/logout
            issuer-uri: ${AUTH_SERVER_BASE_URL:http://auth.example.com}

auth-server:
  base-url: ${AUTH_SERVER_BASE_URL:http://auth.example.com}

portal:
  frontend-origin: ${PORTAL_FRONTEND_ORIGIN:http://portal.example.com}

# 生产环境降低日志级别
logging:
  level:
    root: WARN
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.springframework.security.oauth2: WARN
    net.xzh.portal: INFO
