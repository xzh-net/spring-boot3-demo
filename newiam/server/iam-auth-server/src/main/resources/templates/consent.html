<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授权确认</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            padding: 28px 32px;
        }
        .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .header p { font-size: 13px; opacity: 0.85; }
        .body { padding: 28px 32px; }
        .client-info {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            margin-bottom: 24px;
        }
        .client-icon {
            width: 44px; height: 44px;
            background: #2563eb; color: #fff;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; flex-shrink: 0;
        }
        .client-detail { flex: 1; min-width: 0; }
        .client-name { font-size: 15px; font-weight: 600; color: #0f172a;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .client-id { font-size: 12px; color: #64748b; margin-top: 2px; }
        .section-title {
            font-size: 13px; font-weight: 600; color: #334155;
            margin-bottom: 12px;
        }
        .scope-list {
            list-style: none; border: 1px solid #e2e8f0;
            border-radius: 10px; overflow: hidden; margin-bottom: 28px;
        }
        .scope-item {
            display: flex; align-items: flex-start; gap: 12px;
            padding: 12px 16px; border-bottom: 1px solid #f1f5f9;
        }
        .scope-item:last-child { border-bottom: none; }
        .scope-check {
            width: 18px; height: 18px;
            border: 1.5px solid #2563eb; border-radius: 4px;
            flex-shrink: 0; margin-top: 1px;
            display: flex; align-items: center; justify-content: center;
            background: #2563eb; cursor: pointer;
        }
        .scope-check::after { content: "✓"; color: #fff; font-size: 11px; font-weight: 700; }
        .scope-check.unchecked { background: #fff; border-color: #cbd5e1; }
        .scope-check.unchecked::after { content: ""; }
        .scope-text { flex: 1; }
        .scope-name { font-size: 14px; font-weight: 500; color: #0f172a; }
        .scope-desc { font-size: 12px; color: #64748b; margin-top: 2px; }
        .footer {
            background: #f8fafc; border-top: 1px solid #e2e8f0;
            padding: 18px 32px; display: flex; gap: 12px;
        }
        .btn {
            flex: 1; padding: 11px 20px; border-radius: 8px;
            font-size: 14px; font-weight: 500; cursor: pointer;
            border: none; transition: all 0.2s;
        }
        .btn-cancel { background: #ffffff; color: #475569; border: 1px solid #cbd5e1; }
        .btn-cancel:hover { background: #f1f5f9; }
        .btn-allow {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }
        .btn-allow:hover {
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            transform: translateY(-1px);
        }
        .privacy-tip {
            font-size: 12px; color: #94a3b8; text-align: center; margin-top: 16px;
        }
        .form { display: contents; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>🔐 授权请求</h1>
            <p>应用请求访问您的部分信息</p>
        </div>
        <form th:action="${requestURI}" method="post">
            <input type="hidden" name="client_id" th:value="${clientId}"/>
            <input type="hidden" name="state" th:value="${state}"/>
            <input type="hidden" name="user_code" th:if="${userCode}" th:value="${userCode}"/>

            <div class="body">
                <div class="client-info">
                    <div class="client-icon">🛡️</div>
                    <div class="client-detail">
                        <div class="client-name" th:text="${clientName} ?: ${clientId}">客户端</div>
                        <div class="client-id" th:text="'ID: ' + ${clientId}">client-id</div>
                    </div>
                </div>

                <div th:if="${userCode}" style="background:#fef3c7;border:1px solid #fde68a;border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:13px;color:#92400e;">
                    📱 您正在授权设备，用户码：<strong th:text="${userCode}"></strong><br>
                    <span style="font-size:12px;">请确认此用户码与设备上显示的一致</span>
                </div>

                <div class="section-title">📋 请求的权限</div>
                <ul class="scope-list">
                    <li class="scope-item" th:each="entry : ${scopes}">
                        <input type="hidden" name="scope" th:value="${entry.key}"/>
                        <div class="scope-check"></div>
                        <div class="scope-text">
                            <div class="scope-name" th:text="${entry.key}">scope</div>
                            <div class="scope-desc" th:if="${entry.value}" th:text="${entry.value}"></div>
                        </div>
                    </li>
                </ul>

                <div class="privacy-tip">您可随时在认证中心撤销此授权</div>
            </div>

            <div class="footer">
                <button type="submit" name="consent" value="deny" class="btn btn-cancel">拒绝</button>
                <button type="submit" name="consent" value="allow" class="btn btn-allow">允许</button>
            </div>
        </form>
    </div>
</body>
</html>
