<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            min-height: 100vh;
            background: #f1f5f9;
            display: flex; align-items: center; justify-content: center;
            color: #0f172a;
        }
        .login-card {
            width: 400px; background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06), 0 24px 48px rgba(15, 23, 42, 0.08);
            padding: 40px 36px;
            border: 1px solid #e2e8f0;
        }
        .login-card h1 {
            font-size: 22px; font-weight: 700; text-align: center;
            margin-bottom: 6px; color: #0f172a;
        }
        .login-card .subtitle {
            font-size: 12px; color: #64748b; text-align: center;
            margin-bottom: 28px; letter-spacing: 0.3px;
        }
        .form-row { margin-bottom: 18px; }
        .form-row label {
            display: block; font-size: 12px; color: #475569;
            margin-bottom: 6px; font-weight: 500;
        }
        .form-row input {
            width: 100%; padding: 12px 14px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            color: #0f172a; font-size: 14px;
            outline: none; transition: all 0.2s;
        }
        .form-row input::placeholder { color: #94a3b8; }
        .form-row input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        .btn-login {
            width: 100%; padding: 12px;
            background: #2563eb;
            color: #fff; font-size: 15px; font-weight: 600;
            border: none; border-radius: 8px; cursor: pointer;
            transition: all 0.2s; margin-top: 6px;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }
        .btn-login:hover {
            background: #1d4ed8;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }
        .btn-login:active { transform: translateY(0); }
        .alert {
            padding: 10px 14px; border-radius: 8px; font-size: 13px;
            margin-bottom: 16px; display: none;
        }
        .alert.error {
            background: #fef2f2;
            border: 1px solid #fecaca; color: #dc2626;
        }
        .alert.logout {
            background: #f0fdf4;
            border: 1px solid #bbf7d0; color: #16a34a;
        }
        .accounts-hint {
            margin-top: 18px;
            padding: 12px 14px;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 12px;
            color: #64748b;
            line-height: 1.8;
            border: 1px solid #e2e8f0;
        }
        .accounts-hint strong {
            color: #2563eb; font-weight: 600;
        }
        .footer {
            text-align: center; margin-top: 20px;
            font-size: 12px; color: #94a3b8;
        }
        .footer a { color: #2563eb; text-decoration: none; }
        .footer a:hover { text-decoration: underline; color: #1d4ed8; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🚀 统一认证中心</h1>

        <div id="errorAlert" class="alert error">用户名或密码错误，请重试</div>
        <div id="logoutAlert" class="alert logout">您已成功退出登录</div>

        <form action="/login" method="post">
            <div class="form-row">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username" required>
            </div>
            <div class="form-row">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-login">登 录</button>
        </form>

        <div class="accounts-hint">
            测试账号：<br>
            <strong>user</strong> / 123456（普通用户）
        </div>

        <div class="footer">
            <a href="http://localhost:8201/">管理后台 →</a>
        </div>
    </div>

<script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        if (params.get('error') !== null) {
            document.getElementById('errorAlert').style.display = 'block';
        }
        if (params.get('logout') !== null) {
            document.getElementById('logoutAlert').style.display = 'block';
        }
        // 设备验证链跳转过来时带 ?type=device, 将表单 action 改为 /device-login
        if (params.get('type') === 'device') {
            document.querySelector('form').action = '/device-login';
        }
    })();
</script>
</body>
</html>
