server:
  port: 8080
  servlet:
    session:
      cookie:
        # 【SSO 关键】本应用与授权服务器(9000)同在 localhost，默认 JSESSIONID cookie 会互相覆盖。
        # 给客户端设置独立的 cookie 名称，避免 8080 → 9000 → 8080 跳转过程中丢失 HttpSession
        # (HttpSession 中存有 OAuth2AuthorizationRequest，丢失会导致 state mismatch)
        name: PORTAL_SERVER_SESSION

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
    net.xzh.portal: DEBUG

spring:
  # ===== 多环境切换: dev / local / prod =====
  # 对应配置文件: application-{profile}.yml (OAuth2 端点地址等环境相关配置)
  # 也可通过命令行覆盖: --spring.profiles.active=prod
  profiles:
    active: dev

  thymeleaf:
    cache: false
  security:
    oauth2:
      client:
        registration:
          # 对接 spring-authorization-server 中的 portal-app 客户端
          portal-app-oidc:
            provider: spring-auth-server
            client-id: portal-app
            client-secret: 123456
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # 前后端分离: 登出后直接回到 portal-app 前端 (8000), 不经过 portal-server
            # SecurityConfig 中 OidcClientInitiatedLogoutSuccessHandler 会使用 frontendOrigin + "/logged-out"
            post-logout-redirect-uri: "http://localhost:8000/logged-out"
            scope: openid, profile, email
            client-name: 门户应用 (SSO)
        provider:
          spring-auth-server:
            # 显式指定各端点 URL，避免启动时外部 HTTP 调用 (issuer-uri 发现)
            # 认证中心地址在 application-{profile}.yml 中按环境配置
            authorization-uri: http://localhost:9000/oauth2/authorize
            token-uri: http://localhost:9000/oauth2/token
            jwk-set-uri: http://localhost:9000/oauth2/jwks
            user-info-uri: http://localhost:9000/userinfo
            # OIDC end_session_endpoint (RP-Initiated Logout)
            logout-uri: http://localhost:9000/logout
            user-info-authentication-method: header
            user-name-attribute: sub
            issuer-uri: http://localhost:9000

# 认证中心地址 (用于调用公开 API 获取客户端列表)
auth-server:
  base-url: http://localhost:9000
  clients-api: /api/public/clients

# portal-app 前端地址 (用于 CORS)
portal:
  frontend-origin: http://localhost:8000
