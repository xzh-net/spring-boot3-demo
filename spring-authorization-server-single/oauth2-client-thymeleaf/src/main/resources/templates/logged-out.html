<!DOCTYPE html>
<html lang="zh" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>已登出</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            padding: 48px 64px;
            text-align: center;
            max-width: 480px;
        }
        .icon {
            font-size: 48px;
            color: #5cb85c;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 12px 0;
            color: #2c3e50;
        }
        p {
            color: #777;
            font-size: 14px;
            margin: 0 0 24px 0;
            line-height: 1.6;
        }
        .login-btn {
            background: #4a90e2;
            color: #fff;
            border: none;
            padding: 10px 28px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }
        .login-btn:hover {
            background: #357abd;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">✓</div>
    <h1>已安全登出</h1>
    <p>
        已通过 OIDC RP-Initiated Logout 协议<br/>
        同步登出授权服务器端会话
    </p>
    <a th:href="@{/}" class="login-btn">重新登录</a>
</div>
</body>
</html>
