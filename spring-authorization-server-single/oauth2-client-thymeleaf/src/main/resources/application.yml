server:
  port: 8083
  servlet:
    session:
      cookie:
        # 【SSO 关键】本应用与授权服务器(9000)同在 localhost，默认 JSESSIONID cookie 会互相覆盖。
        # 给客户端设置独立的 cookie 名称，避免 8083 → 9000 → 8083 跳转过程中丢失 HttpSession
        # (HttpSession 中存有 OAuth2AuthorizationRequest，丢失会导致 state mismatch)
        name: CLIENT_SESSION

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.web.FilterChainProxy: INFO

spring:
  thymeleaf:
    cache: false
  security:
    oauth2:
      client:
        registration:
          # 对接 spring-authorization-server-single 中的 web-app 客户端
          # 使用授权码模式 + client_secret_basic 认证
          web-app-oidc:
            provider: spring-auth-server
            client-id: web-app
            client-secret: 123456
            authorization-grant-type: authorization_code
            # Spring Security OAuth2 Client 默认回调路径
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # OIDC 登出后回到本应用的 /logged-out 页面
            post-logout-redirect-uri: "{baseUrl}/logged-out"
            scope: openid, profile, email
            client-name: Web 应用 (授权码 + 密钥)
        provider:
          spring-auth-server:
            # 不使用 issuer-uri 自动发现 (启动时依赖授权服务器在线, 并行启动时容易失败)
            # 改为显式指定各端点 URL, 避免启动时外部 HTTP 调用
            authorization-uri: http://localhost:9000/oauth2/authorize
            token-uri: http://localhost:9000/oauth2/token
            jwk-set-uri: http://localhost:9000/oauth2/jwks
            user-info-uri: http://localhost:9000/userinfo
            # OIDC end_session_endpoint (RP-Initiated Logout 使用)
            # 在旧版本 Spring 中叫 end-session-endpoint, 新版本统一为 logout-uri
            # 两者都写上以兼容
            # 与授权服务器 AuthorizationServerSettings.oidcLogoutEndpoint("/logout") 保持一致
            logout-uri: http://localhost:9000/logout
            user-info-authentication-method: header
            user-name-attribute: sub
            # 【关键】移除 issuer-uri, 避免启动时自动调用 /.well-known/openid-configuration 导致失败
            # id_token iss 校验通过自定义 JwtDecoder 处理
